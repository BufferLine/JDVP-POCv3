services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.onnx
    expose:
      - "8000"
    volumes:
      - ../../models/jdvp-embedding-bge-small-en-v1.5-20260408:/app/models/embedding:ro
      - ./backend/onnx_model_v2:/app/models/onnx:ro
      - ./backend/regressors.pkl:/app/regressors.pkl:ro
    environment:
      - JDVP_BACKEND=onnx
      - JDVP_ONNX_MODEL_PATH=/app/models/onnx
